<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試做</title>
    <style>
        .box1-1 {
            background-color: aquamarine;
            border: 3px solid black;
            margin-right: 10px;
            padding: 10PX;
        }

        .box1-1 .box1-1inner{
            border:1px solid black;
        }

        .box1-2 {
            background-color: aqua;
            border: 3px solid red;
            padding: 10px;
        }

        .box1-2 .box1-2inner {
            border: 1px solid black;
        }

        .box1-3 {
            background-color: gray;
            border: 3px dotted black;
            margin-top: 30px;
            width: 205px;
            padding: 10PX;

        }

        .box1-3-1{
            border: 1px solid black;
            margin-right: 10px;
        }

        .box1-3-2{
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <span class="box1-1">
        <span class="box1-1inner">我是span1-1</span>
    </span>
    <span class="box1-2">我是span1-2</span>
    <div class="box1-3">
        <span class="box1-3-1">span3-1</span>
        <span class="box1-3-2">span3-2</span>
    </div>

</body>

</html>
